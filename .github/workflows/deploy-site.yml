# Public site (ADR 0005): builds site/ with Hugo and uploads it to the OVH
# web hosting. See site/README.md for the secrets and variables to set.
#
# - Pull request touching site/: build only, as a check.
# - Push to main touching site/: build, then upload. The upload is skipped
#   (with a notice) until the secrets and the remote folder are configured.

name: Public site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read

# Never two uploads at the same time; a newer push waits for the current one.
concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  build-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5

      - uses: peaceiris/actions-hugo@v3
        with:
          # Pinned for reproducible builds: update it on purpose, after
          # building locally with the same version (site/README.md).
          hugo-version: '0.167.0'

      - name: Build
        run: hugo --minify --gc

      - name: Check generated files
        # Hidden files are easy to lose: Apache rules and App Links.
        run: |
          test -f public/.htaccess
          test -f public/.well-known/assetlinks.json
          test -f public/i/index.html
          python3 -m json.tool public/.well-known/assetlinks.json > /dev/null

      - name: Check deployment configuration
        id: config
        if: github.event_name != 'pull_request'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SITE_REMOTE_DIR: ${{ vars.SITE_REMOTE_DIR }}
        run: |
          if [ -n "$FTP_SERVER" ] && [ -n "$FTP_USERNAME" ] && [ -n "$FTP_PASSWORD" ] && [ -n "$SITE_REMOTE_DIR" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Upload skipped: set the FTP_SERVER, FTP_USERNAME and FTP_PASSWORD secrets and the SITE_REMOTE_DIR variable (see site/README.md)."
          fi

      - name: Upload to OVH
        if: steps.config.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # FTP over TLS: the password never travels in clear text.
          protocol: ftps
          local-dir: site/public/
          server-dir: ${{ vars.SITE_REMOTE_DIR }}
          # Only uploads what changed. The sync state is kept on the server
          # (.ftp-deploy-sync-state.json), never committed to the repository.
          # Explicit list, same as the action's defaults: hidden files such
          # as .htaccess and .well-known/ are uploaded.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
