name: CI

on:
  push:
    branches: [main]
    # Backend versions (ADR 0011): api-v1.0.0 publishes the images 1.0.0
    # and 1.0, and the release notes.
    tags: ['api-v*']
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend typecheck and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: step_challenge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/step_challenge_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit
      - run: npx tsc --noEmit
      # Schema created by the migration image, as in production (ADR 0011).
      - run: docker build -t step-challenge-migrations migrations
      - run: >-
          docker run --rm --network host
          -e FLYWAY_URL=jdbc:postgresql://localhost:5432/step_challenge_test
          -e FLYWAY_USER=postgres -e FLYWAY_PASSWORD=test
          step-challenge-migrations
      - run: npm test

  mobile:
    name: Mobile typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci --no-audit
      # Generated by Expo and git-ignored; provides types for CSS imports.
      - run: echo '/// <reference types="expo/types" />' > expo-env.d.ts
      - run: npx tsc --noEmit
      - run: npm run check:i18n

  # Images of the backend (ADR 0011, docs/exploitation.md), published
  # once the tests pass: sha-<commit> for every push to main, X.Y.Z and
  # X.Y for a tag api-vX.Y.Z. No latest: the operator picks a version.
  images:
    name: Publish image (${{ matrix.image }})
    if: github.event_name == 'push'
    needs: [secrets, backend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: step-challenge-api
            context: backend
            description: Step Challenge API (Fastify). Requires the step-challenge-migrations image of the same version.
          - image: step-challenge-migrations
            context: backend/migrations
            description: Step Challenge database migrations (Flyway). Run before the step-challenge-api image of the same version.
    env:
      # GHCR shows the description of the index of a multi-platform image.
      DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
    steps:
      - uses: actions/checkout@v5
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          flavor: |
            latest=false
          tags: |
            type=sha
            type=match,pattern=^api-v(\d+\.\d+\.\d+)$,group=1
            type=match,pattern=^api-v(\d+\.\d+)\.\d+$,group=1
          labels: |
            org.opencontainers.image.description=${{ matrix.description }}
          annotations: |
            org.opencontainers.image.description=${{ matrix.description }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # No RUN step in the final stages: both platforms are built without
      # emulation.
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # GitHub Release of a backend version, with its notes for the operator
  # taken from backend/CHANGELOG.md: fails if the version has none.
  release:
    name: Release notes
    if: startsWith(github.ref, 'refs/tags/api-v')
    needs: [images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Extract the notes of this version
        run: |
          version="${GITHUB_REF_NAME#api-v}"
          awk -v version="$version" '
            $0 ~ "^## " { found = ($2 == version) ; next }
            found { print }
          ' backend/CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::backend/CHANGELOG.md has no section '## $version'"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --title "API $VERSION"
          --notes-file notes.md
          --verify-tag
