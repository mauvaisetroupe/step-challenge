{{- /*
  Redirect pages generated by Hugo, such as / → /en/. Relative URL, so
  that the redirect also works on the temporary preview host (ADR 0005).
*/ -}}
{{- $url := .Permalink | relURL -}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url={{ $url }}">
  <link rel="canonical" href="{{ .Permalink }}">
  <title>Step Challenge</title>
</head>
<body>
  <p><a href="{{ $url }}">Step Challenge</a></p>
</body>
</html>
