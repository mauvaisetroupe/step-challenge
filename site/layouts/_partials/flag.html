{{- /* Inline SVG flags: no image request, no emoji (not shown on Windows). */ -}}
{{- if eq . "fr" -}}
<svg class="flag" viewBox="0 0 3 2" width="24" height="16" aria-hidden="true"><rect width="1" height="2" fill="#002654"/><rect x="1" width="1" height="2" fill="#fff"/><rect x="2" width="1" height="2" fill="#ce1126"/></svg>
{{- else if eq . "en" -}}
<svg class="flag" viewBox="0 0 60 30" width="24" height="16" preserveAspectRatio="none" aria-hidden="true"><clipPath id="flag-uk-clip"><path d="M30,15 H60 V30 Z M30,15 V30 H0 Z M30,15 H0 V0 Z M30,15 V0 H60 Z"/></clipPath><path d="M0,0 v30 h60 v-30 z" fill="#012169"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#flag-uk-clip)" stroke="#C8102E" stroke-width="4"/><path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/><path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/></svg>
{{- end -}}
