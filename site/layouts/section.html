{{ define "main" }}
<article class="content">
  <h1>{{ .Title }}</h1>
  {{ .Content }}
  <ul class="cards">
    {{- range .Pages.ByWeight }}
    <li>
      <a href="{{ .RelPermalink }}">
        <strong>{{ .Title }}</strong>
        {{- with .Description }}<span>{{ . }}</span>{{ end }}
      </a>
    </li>
    {{- end }}
  </ul>
</article>
{{ end }}
