# Public site of Step Challenge (ADR 0005): https://step.architech.lu
#
# Built with the Hugo version pinned in .github/workflows/deploy-site.yml.
# No theme: the templates are in layouts/.

baseURL = 'https://step.architech.lu/'
title = 'Step Challenge'

# English by default, each language in its own folder: /en/… and /fr/…
# The root / is a redirect to /en/ generated by Hugo.
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = true

# Only plain pages: no tags, categories or RSS feeds.
disableKinds = ['taxonomy', 'term', 'rss']

# Same paths in both languages: content/privacy.en.md and
# content/privacy.fr.md become /en/privacy/ and /fr/privacy/.

[languages.en]
  label = 'English'
  locale = 'en'
  weight = 1

[languages.fr]
  label = 'Français'
  locale = 'fr'
  weight = 2

[params]
  description = 'Step challenges between friends'
  playStoreUrl = 'https://play.google.com/store/apps/details?id=lu.architech.stepchallenge'
  sourceUrl = 'https://github.com/mauvaisetroupe/step-challenge'
  email = 'support@architech.lu'

[markup.goldmark.renderer]
  # Content is plain Markdown: no raw HTML.
  unsafe = false

[sitemap]
  changeFreq = 'monthly'
