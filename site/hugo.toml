# Public site of Step Challenge (ADR 0005): https://step.architech.lu
#
# Built with the Hugo version pinned in .github/workflows/deploy-site.yml.
# No theme: the templates are in layouts/.

baseURL = 'https://step.architech.lu/'
title = 'Step Challenge'

# English, the default language, at the root; French under /fr/.
defaultContentLanguage = 'en'

# Pages end in .html (/privacy.html, /help/huawei.html): the addresses
# already declared to Google and Huawei are the pages themselves, with
# no redirect.
uglyURLs = true

# No /en/ copy of the English pages redirecting to the root.
disableDefaultLanguageRedirect = true

# Only plain pages: no tags, categories, RSS feeds or sitemap (the
# multilingual sitemap would live under /en/).
disableKinds = ['taxonomy', 'term', 'rss', 'sitemap']

# Same paths in both languages: content/privacy.en.md and
# content/privacy.fr.md become /privacy.html and /fr/privacy.html.

[languages.en]
  label = 'English'
  locale = 'en'
  weight = 1

[languages.fr]
  label = 'Français'
  locale = 'fr'
  weight = 2

[params]
  description = 'Step challenges between friends'
  playStoreUrl = 'https://play.google.com/store/apps/details?id=lu.architech.stepchallenge'
  sourceUrl = 'https://github.com/mauvaisetroupe/step-challenge'
  email = 'support@architech.lu'

[markup.goldmark.renderer]
  # Content is plain Markdown: no raw HTML.
  unsafe = false

