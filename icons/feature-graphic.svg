<?xml version="1.0" encoding="UTF-8"?>
<!--
  Step Challenge — Google Play feature graphic (1024 x 500).

  Edit it in Inkscape (one layer per element), then run
  `python3 icons/export-app-icons.py` to export feature-graphic.png
  (opaque PNG, as required by Google Play) and upload it in the Play
  Console: Store presence → Main store listing → Feature graphic.

  - Keep the texts and the shoe away from the edges: Google Play may
    crop the banner or overlay a play button on some screens.
  - The shoe is a copy of app-icon-foreground.svg: update it here too
    if the app icon changes.
  - No screenshot with real users' names or step counts here.
-->
